<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Merry Christmas - Thiệp Giáng Sinh Yêu Thương</title>
  <meta name="description" content="Thiệp chúc mừng Giáng sinh tương tác 3D lãng mạn với âm nhạc, hiệu ứng tuyết rơi và tùy biến thông tin cá nhân">
  
  <!-- Favicon -->
  <link rel="icon" href="assets/images/avatar_santa.png?v=2" type="image/png">

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Festive Ambient Background -->
  <div class="bg-overlay"></div>

  <!-- Snowfall & Confetti Interactive Canvases -->
  <canvas id="snow-canvas"></canvas>
  <canvas id="confetti-canvas"></canvas>

  <!-- Hanging Glowing Fairy Lights -->
  <ul class="fairy-lights">
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
  </ul>

  <!-- Top Toolbar -->
  <div class="top-toolbar">
    <button class="tool-btn btn-lang" id="btn-lang-toggle" onclick="toggleLanguage()" title="Chuyển ngôn ngữ / Switch Language">
      🇺🇸 EN
    </button>
    <button class="tool-btn btn-customize" onclick="openModal()" title="Chỉnh sửa thông tin thiệp">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span id="btn-customizer-text">Tạo Thiệp Riêng</span>
    </button>
    <button class="tool-btn" id="btn-snowstorm" onclick="toggleSnowstorm()" title="Tăng hiệu ứng bão tuyết">
      <i class="fa-solid fa-snowflake"></i>
    </button>
    <button class="tool-btn" id="btn-sound-sfx" onclick="toggleSoundSFX()" title="Bật/Tắt hiệu ứng âm thanh">
      <i class="fa-solid fa-volume-high"></i>
    </button>
  </div>

  <!-- Christmas Countdown Badge -->
  <div class="countdown-badge">
    <i class="fa-solid fa-bell"></i>
    <span id="countdown-text">Đang tính thời gian Giáng Sinh...</span>
  </div>

  <!-- Main Presentation Container -->
  <main class="main-wrapper">

    <!-- STAGE 1: Interactive Surprise Present Box -->
    <section id="unboxing-scene" onclick="openSurpriseCard()">
      <div class="gift-box-wrapper">
        <div class="gift-box-glow"></div>
        <img src="assets/images/new_gift_box_image.png" alt="Hộp quà Giáng sinh" class="gift-box-img" id="present-box-img">
      </div>
      <div class="open-prompt">
        <i class="fa-solid fa-heart"></i>
        <span id="open-prompt-text">Nhấn vào hộp quà để mở điều bất ngờ! 🎁</span>
      </div>
    </section>

    <!-- STAGE 2: Deluxe 3D Christmas Card -->
    <section id="card-container">
      <div class="card" id="greeting-card">
        <!-- Pine Tree Accents -->
        <img src="assets/images/christmas_tree.png" alt="Cây thông" class="tree-decor tree-left">
        <img src="assets/images/christmas_tree.png" alt="Cây thông" class="tree-decor tree-right">

        <!-- Card Header -->
        <header class="card-header">
          <h1>Merry Christmas!</h1>
          <div class="recipient-tag">
            <i class="fa-solid fa-crown" style="color: var(--gold);"></i>
            <span id="display-greeting-title">Gửi tặng My Girl cute 💙</span>
          </div>
        </header>

        <!-- Avatar Presentation with Music Vinyl Effect -->
        <div class="avatar-wrapper" id="avatar-container">
          <div class="avatar-wreath"></div>
          <div class="avatar-img-container">
            <img src="assets/images/avatar_santa.png?v=2" alt="Ảnh kỷ niệm" class="avatar-img" id="display-avatar">
          </div>
          <div class="music-badge" onclick="toggleMusic(event)" title="Bật/Tắt nhạc">
            <i class="fa-solid fa-music" id="avatar-music-icon"></i>
          </div>
        </div>

        <!-- Romantic Typewriter Letter -->
        <div class="letter-box">
          <p class="typed-text">
            <span id="typewriter-content"></span><span class="typed-cursor"></span>
          </p>
        </div>

        <!-- Wish Preset Actions -->
        <div class="wish-actions">
          <button class="btn-wish-action" onclick="replayTyping()">
            <i class="fa-solid fa-rotate-right"></i> <span id="btn-replay-text">Đọc lại</span>
          </button>
          <button class="btn-wish-action" onclick="cycleRandomWish()">
            <i class="fa-solid fa-shuffle"></i> <span id="btn-change-wish-text">Đổi lời chúc khác</span>
          </button>
          <button class="btn-wish-action" onclick="triggerMagicSparkles()">
            <i class="fa-solid fa-sparkles"></i> <span id="btn-sparkles-text">Thả tim & sao</span>
          </button>
        </div>

        <!-- Social Connections -->
        <div class="social-links">
          <a href="https://www.facebook.com/me" target="_blank" class="social-icon facebook" id="link-facebook" title="Facebook của bạn">
            <img src="assets/images/fb.png" alt="Facebook">
          </a>
          <a href="https://www.instagram.com/" target="_blank" class="social-icon instagram" id="link-instagram" title="Instagram của bạn">
            <img src="assets/images/ig.png" alt="Instagram">
          </a>
        </div>

        <!-- Replay Box Button -->
        <button class="reopen-box-btn" onclick="resetToBox()">
          <i class="fa-solid fa-box-open"></i> Đóng lại hộp quà
        </button>
      </div>
    </section>

  </main>

  <!-- FLOATING BOTTOM MUSIC PLAYER DOCK -->
  <aside class="music-dock" id="music-dock">
    <div class="dock-vinyl">
      <i class="fa-solid fa-compact-disc"></i>
    </div>
    <div class="track-meta">
      <div class="track-name" id="track-title">Khúc Nhạc Giáng Sinh An Lành</div>
      <div class="track-progress-container" id="track-progress-container" onclick="seekTrack(event)">
        <div class="track-progress-bar" id="track-progress-bar"></div>
      </div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" onclick="prevTrack()" title="Bài trước">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      <button class="ctrl-btn play-btn" onclick="toggleMusic()" id="btn-dock-play" title="Phát/Dừng">
        <i class="fa-solid fa-play" id="dock-play-icon"></i>
      </button>
      <button class="ctrl-btn" onclick="nextTrack()" title="Bài tiếp theo">
        <i class="fa-solid fa-forward-step"></i>
      </button>
    </div>
  </aside>

  <!-- CUSTOMIZER MODAL -->
  <div class="modal-backdrop" id="custom-modal" onclick="if(event.target===this) closeModal()">
    <div class="modal-card">
      <div class="modal-header">
        <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Tạo Thiệp Riêng Của Bạn</h2>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="form-group">
        <label for="input-girl-name"><i class="fa-solid fa-user"></i> Họ tên / Danh xưng:</label>
        <input type="text" id="input-girl-name" placeholder="Ví dụ: My Girl cute">
      </div>

      <div class="form-group">
        <label for="input-girl-nick"><i class="fa-solid fa-heart"></i> Biệt danh đáng yêu:</label>
        <input type="text" id="input-girl-nick" placeholder="Ví dụ: Em bé / Công chúa nhỏ">
      </div>

      <div class="form-group">
        <label for="input-avatar-file"><i class="fa-solid fa-image"></i> Ảnh đại diện:</label>
        <div class="avatar-preview-box">
          <img src="assets/images/avatar_santa.png?v=2" alt="Preview" class="avatar-preview-thumb" id="modal-avatar-preview">
          <label class="btn-file">
            <i class="fa-solid fa-cloud-arrow-up"></i> Chọn ảnh từ máy
            <input type="file" id="input-avatar-file" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="input-wish-msg"><i class="fa-solid fa-envelope-open-text"></i> Lời chúc Giáng sinh:</label>
        <textarea id="input-wish-msg" placeholder="Nhập những lời chúc chân thành, ấm áp nhất..."></textarea>
      </div>

      <div class="form-group">
        <label for="input-fb-url"><i class="fa-brands fa-facebook"></i> Link Facebook:</label>
        <input type="url" id="input-fb-url" placeholder="https://www.facebook.com/me (hoặc link cá nhân)">
      </div>

      <div class="form-group">
        <label for="input-ig-url"><i class="fa-brands fa-instagram"></i> Link Instagram:</label>
        <input type="url" id="input-ig-url" placeholder="https://www.instagram.com/...">
      </div>

      <div class="form-group">
        <label for="select-bg-music"><i class="fa-solid fa-music"></i> Nhạc nền mặc định:</label>
        <select id="select-bg-music" onchange="changeTrackFromSelect(this.value)">
          <option value="0">🎄 Khúc Nhạc Giáng Sinh An Lành (Original)</option>
          <option value="1">🔔 We Wish You A Merry Christmas (Acoustic Chill)</option>
          <option value="2">❄️ Deck The Halls (Festive Orchestral)</option>
          <option value="3">✨ Joy To The World (Holiday Chimes)</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn-save-modal" onclick="saveCustomCard()">
          <i class="fa-solid fa-check"></i> Lưu & Áp Dụng
        </button>
        <button class="btn-copy-link" onclick="copyShareableUrl()" title="Tạo đường link chứa thông tin để gửi tặng">
          <i class="fa-solid fa-share-nodes"></i> Sao Chép Link Tặng
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toast-notification">
    <i class="fa-solid fa-circle-check" style="color: var(--gold);"></i>
    <span id="toast-text">Đã cập nhật thiệp thành công!</span>
  </div>

  <!-- Audio Element -->
  <audio id="main-audio" preload="auto"></audio>

  <!-- Modular Scripts -->
  <script src="assets/js/snow.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
